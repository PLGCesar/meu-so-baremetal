set timeout=0
set default=0

# Carrega os módulos de vídeo VBE do GRUB
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
insmod gfxterm

# Força a resolução e MANTÉM (keep) o modo gráfico ativo para o Kernel
set gfxmode=800x600x32,800x600,auto
set gfxpayload=keep

menuentry "Meu SO Baremetal" {
    multiboot /boot/myos.bin
    boot
}
