name: Compilar Kernel ISO

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-so:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v3

    - name: Construir Imagem Docker
      run: docker build -t os-builder .

    - name: Compilar o Kernel e Gerar a ISO
      run: docker run --rm -v ${{ github.workspace }}:/os os-builder

    - name: Salvar o arquivo ISO como Artefato (Download)
      uses: actions/upload-artifact@v4
      with:
        name: meu-so-iso
        path: meu_so.iso
